spring.application.name=customer-service

# configure server port
server.port=8085

# connect database
spring.datasource.url=jdbc:mysql://localhost:3313/nawasenahost_customer
spring.datasource.username=root
spring.datasource.password=

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# info app
info.app.name=customer-service
info.app.description=customer service responsible for manage customer
info.app.version=1.0

spring.main.banner-mode=off
springdoc.swagger-ui.path=/my-ui.html
springdoc.api-docs.path=/my-api-docs
logging.level.root=info
management.endpoints.web.exposure.include=*
management.info.env.enabled=true


