spring:
  security:
    oauth2:
      client:
        registration:
          customer-client:
            provider: auth-service
            client-id: customer-service
            client-secret: ${CUSTOMER_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
            scope:
              - booking.create
              - audit.write

        provider:
          auth-service:
            token-uri: http://localhost:8087/oauth2/token

  cloud:
    openfeign:
      oauth2:
        enabled: true
        client-registration-id: customer-client