spring:
  security:
    oauth2:
      client:
        registration:
          room-client:
            provider: auth-service
            client-id: room-service
            client-secret: ${ROOM_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
            scope:
              - hotel.read
              - inventory.write

        provider:
          auth-service:
            token-uri: http://localhost:8087/oauth2/token

  cloud:
    openfeign:
      oauth2:
        enabled: true
        client-registration-id: room-client