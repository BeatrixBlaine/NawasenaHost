spring:
  security:
    oauth2:
      client:
        registration:
          payment-client:
            provider: auth-service
            client-id: payment-service
            client-secret: ${PAYMENT_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
            scope:
              - room.read
              - booking.read
              - booking.create

        provider:
          auth-service:
            token-uri: http://localhost:8087/oauth2/token

  cloud:
    openfeign:
      oauth2:
        enabled: true
        client-registration-id: payment-client