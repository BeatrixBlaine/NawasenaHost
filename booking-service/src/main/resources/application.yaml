spring:
  security:
    oauth2:
      client:
        registration:
          booking-client:
            provider: auth-service
            client-id: booking-service
            client-secret: ${SERVICE_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic

        provider:
          auth-service:
            token-uri: http://localhost:8087/oauth2/token

  cloud:
    openfeign:
      oauth2:
        enabled: true
        client-registration-id: booking-client