spring.application.name=booking-service

# configure server port
server.port=8084

# connect database
# spring.datasource.url=jdbc:mysql://localhost:3308/ebohost_room
# spring.datasource.username=ebohost
# spring.datasource.password=12345

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# info app
info.app.name=booking-service
info.app.description=booking service responsible for create booking
info.app.version=1.0

spring.main.banner-mode=off
springdoc.swagger-ui.path=/my-ui.html
springdoc.api-docs.path=/my-api-docs
logging.level.root=info
management.endpoints.web.exposure.include=*
management.info.env.enabled=true


