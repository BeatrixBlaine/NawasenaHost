# NawasenaHost production compose
#   cp .env.example .env   (fill it in, see docs/DEPLOYMENT.md)
#   docker compose up -d --build
#   docker compose up -d --scale ...   or set the *_REPLICAS values in .env
# Only nginx publishes a port, everything else stays on the internal network.

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: UTC
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max-connections=500
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - nawasenahost-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  eureka-server:
    build: ./eureka-server
    image: nawasenahost/eureka-server:${TAG:-latest}
    networks:
      - nawasenahost-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8761'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  auth-service:
    build: ./auth-service
    image: nawasenahost/auth-service:${TAG:-latest}
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/nawasenahost_auth?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_JPA_SHOW_SQL: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_RSA_PRIVATE_KEY: ${JWT_RSA_PRIVATE_KEY}
      JWT_RSA_PUBLIC_KEY: ${JWT_RSA_PUBLIC_KEY}
      NAWASENAHOST_MANAGER_USERNAME: ${NAWASENAHOST_MANAGER_USERNAME}
      NAWASENAHOST_MANAGER_PASSWORD: ${NAWASENAHOST_MANAGER_PASSWORD}
      NAWASENAHOST_MANAGER_EMAIL: ${NAWASENAHOST_MANAGER_EMAIL}
      NAWASENAHOST_MANAGER_HOTEL_ID: ${NAWASENAHOST_MANAGER_HOTEL_ID:-1}
      NAWASENAHOST_ADMIN_USERNAME: ${NAWASENAHOST_ADMIN_USERNAME}
      NAWASENAHOST_ADMIN_PASSWORD: ${NAWASENAHOST_ADMIN_PASSWORD}
      NAWASENAHOST_ADMIN_EMAIL: ${NAWASENAHOST_ADMIN_EMAIL}
      SERVICE_CLIENT_SECRET_BCRYPT: ${SERVICE_CLIENT_SECRET_BCRYPT}
      PAYMENT_CLIENT_SECRET_BCRYPT: ${PAYMENT_CLIENT_SECRET_BCRYPT}
      AVAILABILITY_CLIENT_SECRET_BCRYPT: ${AVAILABILITY_CLIENT_SECRET_BCRYPT}
      ROOM_CLIENT_SECRET_BCRYPT: ${ROOM_CLIENT_SECRET_BCRYPT}
      CUSTOMER_CLIENT_SECRET_BCRYPT: ${CUSTOMER_CLIENT_SECRET_BCRYPT}
    networks:
      - nawasenahost-network
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8087'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    deploy:
      replicas: ${AUTH_SERVICE_REPLICAS:-1}

  hotel-service:
    build: ./hotel-service
    image: nawasenahost/hotel-service:${TAG:-latest}
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/nawasenahost_hotel?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_JPA_SHOW_SQL: "false"
      AUTH_JWKS_URI: http://auth-service:8087/oauth2/jwks
      JWT_SECRET: ${JWT_SECRET}
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_AUTH_SERVICE_TOKEN_URI: http://auth-service:8087/oauth2/token
    networks:
      - nawasenahost-network
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8081'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    deploy:
      replicas: ${HOTEL_SERVICE_REPLICAS:-1}

  room-service:
    build: ./room-service
    image: nawasenahost/room-service:${TAG:-latest}
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/nawasenahost_room?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_JPA_SHOW_SQL: "false"
      AUTH_JWKS_URI: http://auth-service:8087/oauth2/jwks
      JWT_SECRET: ${JWT_SECRET}
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_AUTH_SERVICE_TOKEN_URI: http://auth-service:8087/oauth2/token
      ROOM_CLIENT_SECRET: ${ROOM_CLIENT_SECRET}
    networks:
      - nawasenahost-network
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8082'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    deploy:
      replicas: ${ROOM_SERVICE_REPLICAS:-1}

  availability-service:
    build: ./availability-service
    image: nawasenahost/availability-service:${TAG:-latest}
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/nawasenahost_availability?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_JPA_SHOW_SQL: "false"
      AUTH_JWKS_URI: http://auth-service:8087/oauth2/jwks
      JWT_SECRET: ${JWT_SECRET}
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_AUTH_SERVICE_TOKEN_URI: http://auth-service:8087/oauth2/token
      AVAILABILITY_CLIENT_SECRET: ${AVAILABILITY_CLIENT_SECRET}
    networks:
      - nawasenahost-network
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8083'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    deploy:
      replicas: ${AVAILABILITY_SERVICE_REPLICAS:-1}

  booking-service:
    build: ./booking-service
    image: nawasenahost/booking-service:${TAG:-latest}
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/nawasenahost_booking?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_JPA_SHOW_SQL: "false"
      AUTH_JWKS_URI: http://auth-service:8087/oauth2/jwks
      JWT_SECRET: ${JWT_SECRET}
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_AUTH_SERVICE_TOKEN_URI: http://auth-service:8087/oauth2/token
      SERVICE_CLIENT_SECRET: ${SERVICE_CLIENT_SECRET}
    networks:
      - nawasenahost-network
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8084'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    deploy:
      replicas: ${BOOKING_SERVICE_REPLICAS:-1}

  customer-service:
    build: ./customer-service
    image: nawasenahost/customer-service:${TAG:-latest}
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/nawasenahost_customer?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_JPA_SHOW_SQL: "false"
      AUTH_JWKS_URI: http://auth-service:8087/oauth2/jwks
      JWT_SECRET: ${JWT_SECRET}
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_AUTH_SERVICE_TOKEN_URI: http://auth-service:8087/oauth2/token
      CUSTOMER_CLIENT_SECRET: ${CUSTOMER_CLIENT_SECRET}
    networks:
      - nawasenahost-network
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8085'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    deploy:
      replicas: ${CUSTOMER_SERVICE_REPLICAS:-1}

  payment-service:
    build: ./payment-service
    image: nawasenahost/payment-service:${TAG:-latest}
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/nawasenahost_payment?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_JPA_SHOW_SQL: "false"
      AUTH_JWKS_URI: http://auth-service:8087/oauth2/jwks
      JWT_SECRET: ${JWT_SECRET}
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_AUTH_SERVICE_TOKEN_URI: http://auth-service:8087/oauth2/token
      PAYMENT_CLIENT_SECRET: ${PAYMENT_CLIENT_SECRET}
    networks:
      - nawasenahost-network
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8086'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    deploy:
      replicas: ${PAYMENT_SERVICE_REPLICAS:-1}

  api-gateway:
    build: ./api-gateway
    image: nawasenahost/api-gateway:${TAG:-latest}
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - nawasenahost-network
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8888'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    deploy:
      replicas: ${API_GATEWAY_REPLICAS:-1}

  admin-panel-service:
    build: ./admin-panel-service
    image: nawasenahost/admin-panel-service:${TAG:-latest}
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
      AUTH_SERVICE_URL: http://nginx
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - nawasenahost-network
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8089'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    deploy:
      replicas: ${ADMIN_PANEL_SERVICE_REPLICAS:-1}

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - nawasenahost-network
    depends_on:
      api-gateway:
        condition: service_healthy
      admin-panel-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:

networks:
  nawasenahost-network:
    name: nawasenahost-network
    driver: bridge
