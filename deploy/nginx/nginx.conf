# NawasenaHost load balancer
# /api/  -> api-gateway replicas (round robin, a failed replica is skipped)
# /      -> admin panel replicas (ip_hash, the panel keeps the login session in memory)

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    server_tokens off;
    client_max_body_size 5m;

    # docker resolves a service name to every replica of that service
    upstream gateway_backend {
        server api-gateway:8888 max_fails=3 fail_timeout=15s;
        keepalive 16;
    }

    upstream panel_backend {
        ip_hash;
        server admin-panel-service:8089 max_fails=3 fail_timeout=15s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503;

        location /api/ {
    	proxy_set_header Host $http_host;
    	proxy_set_header X-Real-IP $remote_addr;
    	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    	proxy_set_header X-Forwarded-Proto $scheme;
    	proxy_set_header X-Forwarded-Host $http_host;

    	proxy_set_header Connection "";
    	proxy_pass http://gateway_backend;
	}

        location /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
    	proxy_set_header Host $http_host;
    	proxy_set_header X-Real-IP $remote_addr;
    	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    	proxy_set_header X-Forwarded-Proto $scheme;
    	proxy_set_header X-Forwarded-Host $http_host;

    	proxy_set_header Connection $connection_upgrade;
    	proxy_set_header Upgrade $http_upgrade;

    	proxy_pass http://panel_backend;
	}
    }
}
