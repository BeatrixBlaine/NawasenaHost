spring.application.name=hotel-service

# configure server port
server.port=8081

# connect database
spring.datasource.url=jdbc:mysql://localhost:3307/nawasenahost_hotel
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# info app
info.app.name=hotel-service
info.app.description=hotel service responsible for managing hotel
info.app.version=1.0

spring.main.banner-mode=off
springdoc.swagger-ui.path=/my-ui.html
springdoc.api-docs.path=/my-api-docs
logging.level.root=info
management.endpoints.web.exposure.include=*
management.info.env.enabled=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
