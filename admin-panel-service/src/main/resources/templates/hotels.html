<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout('Hotels', 'hotels', ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<body>
<main class="mx-auto w-full max-w-5xl px-4 py-6 sm:px-8 sm:py-10">

    <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
        <h1 class="page-title">Hotels</h1>
        <a th:href="@{/hotels/new}" class="btn">Add hotel</a>
    </div>

    <div th:replace="~{fragments/components :: alerts}"></div>

    <div class="grid gap-4 sm:grid-cols-2">
        <article th:each="hotel : ${hotelList}" class="card flex flex-col justify-between p-5">
            <div>
                <div class="flex items-start justify-between gap-3">
                    <h2 class="font-display text-lg font-semibold text-slate-900" th:text="${hotel.name}"></h2>
                    <span th:if="${hotel.id == me.hotelId}" class="badge bg-teal-50 text-teal-700">Open now</span>
                </div>
                <p class="mt-1 text-sm text-slate-500" th:text="${hotel.address} + ', ' + ${hotel.city} + ', ' + ${hotel.country} + ' ' + ${hotel.postalCode}"></p>
                <p class="mt-2 text-sm text-slate-600" th:text="${hotel.phone} + ' · ' + ${hotel.email}"></p>
            </div>
            <div class="mt-5 flex flex-wrap items-center gap-3 border-t border-slate-100 pt-4">
                <form th:if="${hotel.id != me.hotelId}" th:action="@{/switch-hotel}" method="post">
                    <input type="hidden" name="hotelId" th:value="${hotel.id}">
                    <button type="submit" class="btn-ghost">Open</button>
                </form>
                <a th:href="@{/hotels/{id}/edit(id=${hotel.id})}" class="text-sm font-semibold text-teal-700 hover:underline">Edit</a>
                <form th:if="${hotel.id != me.hotelId}" th:action="@{/hotels/{id}/delete(id=${hotel.id})}" method="post" class="ml-auto"
                      onsubmit="return confirm('Delete this hotel?');">
                    <button type="submit" class="cursor-pointer text-sm font-semibold text-rose-700 hover:underline">Delete</button>
                </form>
            </div>
        </article>
    </div>

    <p th:if="${hotelList != null and #lists.isEmpty(hotelList)}" class="card p-8 text-center text-sm text-slate-500">No hotels yet.</p>
</main>
</body>
</html>
