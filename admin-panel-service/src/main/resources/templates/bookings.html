<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Bookings')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('bookings')}"></header>

<main class="mx-auto max-w-5xl px-6 py-10">

    <div class="mb-8 flex items-end justify-between">
        <div>
            <h1 class="text-xl font-semibold tracking-tight">Bookings</h1>
            <p class="mt-1 text-sm text-stone-500">All bookings of your hotel.</p>
        </div>

        <div class="flex gap-1 text-sm">
            <a th:href="@{/bookings}" class="rounded-md px-3 py-1.5"
               th:classappend="${status == null or status == ''} ? 'bg-stone-100 text-stone-900' : 'text-stone-500 hover:text-stone-900'">All</a>
            <a th:href="@{/bookings(status='PENDING')}" class="rounded-md px-3 py-1.5"
               th:classappend="${status == 'PENDING'} ? 'bg-stone-100 text-stone-900' : 'text-stone-500 hover:text-stone-900'">Pending</a>
            <a th:href="@{/bookings(status='CONFIRMED')}" class="rounded-md px-3 py-1.5"
               th:classappend="${status == 'CONFIRMED'} ? 'bg-stone-100 text-stone-900' : 'text-stone-500 hover:text-stone-900'">Confirmed</a>
            <a th:href="@{/bookings(status='CANCELLED')}" class="rounded-md px-3 py-1.5"
               th:classappend="${status == 'CANCELLED'} ? 'bg-stone-100 text-stone-900' : 'text-stone-500 hover:text-stone-900'">Cancelled</a>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="card overflow-hidden">
        <table class="w-full">
            <thead class="border-b border-stone-200">
            <tr>
                <th class="th">#</th>
                <th class="th">Room</th>
                <th class="th">Check-in</th>
                <th class="th">Check-out</th>
                <th class="th">Guests</th>
                <th class="th">Status</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-stone-100">
            <tr th:each="booking : ${bookings}">
                <td class="td"><a th:href="@{/bookings/{id}(id=${booking.bookingId})}" class="font-medium text-stone-900 hover:underline" th:text="${booking.bookingId}"></a></td>
                <td class="td" th:text="${booking.roomId}"></td>
                <td class="td" th:text="${booking.checkInDate}"></td>
                <td class="td" th:text="${booking.checkOutDate}"></td>
                <td class="td" th:text="${booking.guestCount}"></td>
                <td class="td"><span th:replace="~{fragments/layout :: status(${booking.status})}"></span></td>
            </tr>
            <tr th:if="${bookings == null or #lists.isEmpty(bookings)}">
                <td colspan="6" class="td py-8 text-center text-stone-400">No bookings found.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

</body>
</html>
