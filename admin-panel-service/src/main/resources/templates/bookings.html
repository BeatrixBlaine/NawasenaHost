<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout('Bookings', 'bookings', ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<body>
<main class="mx-auto w-full max-w-6xl px-4 py-6 sm:px-8 sm:py-10">

    <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
        <h1 class="page-title">Bookings</h1>
        <a th:href="@{/availabilities}" class="btn">New booking</a>
    </div>

    <div th:replace="~{fragments/components :: alerts}"></div>

    <form th:action="@{/bookings}" method="get" class="mb-4 grid gap-3 sm:grid-cols-[1fr_12rem_auto]">
        <input type="search" name="q" th:value="${q}" placeholder="Booking number or OTA reference" class="input">
        <select name="status" class="input">
            <option value="">All statuses</option>
            <option th:each="s : ${T(java.util.List).of('PENDING', 'CONFIRMED', 'COMPLETED', 'CANCELLED')}"
                    th:value="${s}" th:text="${s}" th:selected="${s == status}"></option>
        </select>
        <button type="submit" class="btn-ghost">Filter</button>
    </form>

    <div class="card overflow-x-auto">
        <table class="min-w-full divide-y divide-slate-100">
            <thead>
            <tr>
                <th class="th">No.</th>
                <th class="th">Stay</th>
                <th class="th hidden md:table-cell">Room</th>
                <th class="th hidden md:table-cell">Guests</th>
                <th class="th hidden sm:table-cell">Source</th>
                <th class="th">Status</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="b : ${bookings}" class="hover:bg-slate-50">
                <td class="td"><a th:href="@{/bookings/{id}(id=${b.bookingId})}" class="font-semibold text-teal-700 hover:underline" th:text="'#' + ${b.bookingId}"></a></td>
                <td class="td whitespace-nowrap" th:text="${#temporals.format(b.checkInDate, 'd MMM')} + ' → ' + ${#temporals.format(b.checkOutDate, 'd MMM yyyy')}"></td>
                <td class="td hidden md:table-cell" th:text="${b.roomId}"></td>
                <td class="td hidden md:table-cell" th:text="${b.guestCount}"></td>
                <td class="td hidden sm:table-cell">
                    <span th:text="${b.source}"></span>
                    <span th:if="${b.externalReference != null}" class="block text-xs text-slate-400" th:text="${b.externalReference}"></span>
                </td>
                <td class="td"><span th:replace="~{fragments/components :: status(${b.status})}"></span></td>
            </tr>
            <tr th:if="${bookings != null and #lists.isEmpty(bookings)}">
                <td colspan="6" class="td py-10 text-center text-slate-500">No bookings found.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
