<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Rooms')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('rooms')}"></header>

<main class="mx-auto max-w-5xl px-6 py-10">

    <div class="mb-8">
        <h1 class="text-xl font-semibold tracking-tight">Rooms</h1>
        <p class="mt-1 text-sm text-stone-500">All rooms of your hotel.</p>
    </div>

    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="card overflow-hidden">
        <table class="w-full">
            <thead class="border-b border-stone-200">
            <tr>
                <th class="th">Room</th>
                <th class="th">Type</th>
                <th class="th">Capacity</th>
                <th class="th text-right">Price / night</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-stone-100">
            <tr th:each="room : ${rooms}">
                <td class="td font-medium text-stone-900" th:text="${room.roomNumber}"></td>
                <td class="td" th:text="${room.roomType}"></td>
                <td class="td" th:text="${room.capacity} + ' guests'"></td>
                <td class="td text-right" th:text="${#numbers.formatDecimal(room.price, 1, 'COMMA', 0, 'POINT')}"></td>
            </tr>
            <tr th:if="${rooms == null or #lists.isEmpty(rooms)}">
                <td colspan="4" class="td py-8 text-center text-stone-400">No rooms found.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

</body>
</html>
