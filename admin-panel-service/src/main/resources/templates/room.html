<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout('Rooms', 'rooms', ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<body>
<main class="mx-auto w-full max-w-6xl px-4 py-6 sm:px-8 sm:py-10">

    <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
        <h1 class="page-title">Rooms</h1>
        <a th:if="${me.role != 'STAFF'}" th:href="@{/rooms/new}" class="btn">Add room</a>
    </div>

    <div th:replace="~{fragments/components :: alerts}"></div>

    <div class="card overflow-x-auto">
        <table class="min-w-full divide-y divide-slate-100">
            <thead>
            <tr>
                <th class="th">Room</th>
                <th class="th">Type</th>
                <th class="th hidden sm:table-cell">Guests</th>
                <th class="th">Price / night</th>
                <th class="th" th:if="${me.role != 'STAFF'}"></th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="room : ${rooms}" class="hover:bg-slate-50">
                <td class="td font-semibold text-slate-900" th:text="${room.roomNumber}"></td>
                <td class="td" th:text="${room.roomType}"></td>
                <td class="td hidden sm:table-cell" th:text="${room.capacity}"></td>
                <td class="td whitespace-nowrap" th:text="${currency} + ' ' + ${#numbers.formatDecimal(room.price, 1, 'COMMA', 0, 'POINT')}"></td>
                <td class="td whitespace-nowrap text-right" th:if="${me.role != 'STAFF'}">
                    <a th:href="@{/rooms/{id}/edit(id=${room.roomId})}" class="font-medium text-teal-700 hover:underline">Edit</a>
                    <form th:action="@{/rooms/{id}/delete(id=${room.roomId})}" method="post" class="ml-3 inline"
                          onsubmit="return confirm('Delete this room?');">
                        <button type="submit" class="cursor-pointer font-medium text-rose-700 hover:underline">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${rooms != null and #lists.isEmpty(rooms)}">
                <td colspan="5" class="td py-10 text-center text-slate-500">No rooms yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
