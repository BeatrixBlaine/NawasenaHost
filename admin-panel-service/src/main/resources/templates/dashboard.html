<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('dashboard')}"></header>

<main class="mx-auto max-w-5xl px-6 py-10">

    <div class="mb-8 flex items-end justify-between">
        <div>
            <h1 class="text-xl font-semibold tracking-tight">Dashboard</h1>
            <p class="mt-1 text-sm text-stone-500">Tonight at a glance.</p>
        </div>
        <a th:href="@{/availabilities}" class="btn">New booking</a>
    </div>

    <p th:if="${roomError}" th:text="${roomError}" class="mb-4 rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800"></p>
    <p th:if="${bookingError}" th:text="${bookingError}" class="mb-4 rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800"></p>

    <section class="grid grid-cols-2 gap-4 md:grid-cols-4">
        <div class="card p-5">
            <p class="label">Rooms</p>
            <p class="text-2xl font-semibold" th:text="${totalRooms != null} ? ${totalRooms} : '–'">–</p>
        </div>
        <div class="card p-5">
            <p class="label">Occupied tonight</p>
            <p class="text-2xl font-semibold" th:text="${occupiedTonight != null} ? ${occupiedTonight} : '–'">–</p>
        </div>
        <div class="card p-5">
            <p class="label">Pending</p>
            <p class="text-2xl font-semibold" th:text="${pendingBookings != null} ? ${pendingBookings} : '–'">–</p>
        </div>
        <div class="card p-5">
            <p class="label">Confirmed</p>
            <p class="text-2xl font-semibold" th:text="${confirmedBookings != null} ? ${confirmedBookings} : '–'">–</p>
        </div>
    </section>

    <section class="mt-10">
        <div class="mb-3 flex items-center justify-between">
            <h2 class="text-sm font-medium">Recent bookings</h2>
            <a th:href="@{/bookings}" class="text-sm text-stone-500 hover:text-stone-900">View all</a>
        </div>

        <div class="card overflow-hidden">
            <table class="w-full">
                <thead class="border-b border-stone-200">
                <tr>
                    <th class="th">#</th>
                    <th class="th">Room</th>
                    <th class="th">Stay</th>
                    <th class="th">Status</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-stone-100">
                <tr th:each="booking : ${recentBookings}">
                    <td class="td"><a th:href="@{/bookings/{id}(id=${booking.bookingId})}" class="font-medium text-stone-900 hover:underline" th:text="${booking.bookingId}"></a></td>
                    <td class="td" th:text="${booking.roomId}"></td>
                    <td class="td" th:text="${booking.checkInDate} + ' → ' + ${booking.checkOutDate}"></td>
                    <td class="td"><span th:replace="~{fragments/layout :: status(${booking.status})}"></span></td>
                </tr>
                <tr th:if="${recentBookings == null or #lists.isEmpty(recentBookings)}">
                    <td colspan="4" class="td py-8 text-center text-stone-400">No bookings yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

</body>
</html>
