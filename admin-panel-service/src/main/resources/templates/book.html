<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout('Guest details', 'availabilities', ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<body>
<main class="mx-auto w-full max-w-2xl px-4 py-6 sm:px-8 sm:py-10">

    <a th:href="@{/availabilities(checkInDate=${form.checkInDate}, checkOutDate=${form.checkOutDate})}"
       class="text-sm text-slate-500 hover:text-slate-900">← Back to rooms</a>

    <div class="mb-6 mt-4">
        <h1 class="page-title">Guest details</h1>
        <p class="mt-1 text-sm text-slate-500" th:if="${room != null}"
           th:text="'Room ' + ${room.roomNumber} + ' · ' + ${room.roomType} + ' · ' + ${form.checkInDate} + ' → ' + ${form.checkOutDate}"></p>
    </div>

    <div th:replace="~{fragments/components :: alerts}"></div>

    <form th:if="${room != null}" th:action="@{/create-booking}" th:object="${form}" method="post" class="card space-y-5 p-5 sm:p-6">

        <input type="hidden" th:field="*{roomId}">
        <input type="hidden" th:field="*{checkInDate}">
        <input type="hidden" th:field="*{checkOutDate}">

        <div class="grid gap-5 sm:grid-cols-2">
            <div>
                <label for="firstName" class="label">First name</label>
                <input id="firstName" th:field="*{firstName}" type="text" class="input">
                <p th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="field-error"></p>
            </div>
            <div>
                <label for="lastName" class="label">Last name</label>
                <input id="lastName" th:field="*{lastName}" type="text" class="input">
                <p th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="field-error"></p>
            </div>
            <div>
                <label for="email" class="label">Email</label>
                <input id="email" th:field="*{email}" type="email" class="input">
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="field-error"></p>
            </div>
            <div>
                <label for="phone" class="label">Phone</label>
                <input id="phone" th:field="*{phone}" type="tel" class="input">
                <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="field-error"></p>
            </div>
            <div>
                <label for="guestCount" class="label">Guests</label>
                <input id="guestCount" th:field="*{guestCount}" type="number" min="1" th:max="${room.capacity}" class="input">
                <p th:if="${#fields.hasErrors('guestCount')}" th:errors="*{guestCount}" class="field-error"></p>
            </div>
        </div>

        <div class="flex justify-end border-t border-slate-100 pt-5">
            <button type="submit" class="btn w-full sm:w-auto">Create booking</button>
        </div>
    </form>
</main>
</body>
</html>
