<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · NawasenaHost'">NawasenaHost</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>

<body>

<header th:fragment="nav(active)" class="border-b border-stone-200 bg-white">
    <div class="mx-auto flex h-14 max-w-5xl items-center justify-between px-6">

        <div class="flex items-center gap-8">
            <a th:href="@{/dashboard}" class="text-sm font-semibold tracking-tight">NawasenaHost</a>

            <nav class="flex items-center gap-1 text-sm">
                <a th:href="@{/dashboard}"
                   th:classappend="${active == 'dashboard'} ? 'text-stone-900 bg-stone-100' : 'text-stone-500 hover:text-stone-900'"
                   class="rounded-md px-3 py-1.5">Dashboard</a>
                <a th:href="@{/rooms}"
                   th:classappend="${active == 'rooms'} ? 'text-stone-900 bg-stone-100' : 'text-stone-500 hover:text-stone-900'"
                   class="rounded-md px-3 py-1.5">Rooms</a>
                <a th:href="@{/availabilities}"
                   th:classappend="${active == 'availabilities'} ? 'text-stone-900 bg-stone-100' : 'text-stone-500 hover:text-stone-900'"
                   class="rounded-md px-3 py-1.5">New booking</a>
                <a th:href="@{/bookings}"
                   th:classappend="${active == 'bookings'} ? 'text-stone-900 bg-stone-100' : 'text-stone-500 hover:text-stone-900'"
                   class="rounded-md px-3 py-1.5">Bookings</a>
            </nav>
        </div>

        <form th:action="@{/logout}" method="post">
            <button type="submit" class="text-sm text-stone-500 hover:text-stone-900 cursor-pointer">Log out</button>
        </form>
    </div>
</header>

<div th:fragment="alerts" class="mb-6 space-y-3">
    <p th:if="${success}" th:text="${success}"
       class="rounded-md border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800"></p>
    <p th:if="${error}" th:text="${error instanceof T(String) ? error : error.message}"
       class="rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800"></p>
</div>

<span th:fragment="status(value)"
      th:text="${value}"
      th:classappend="${value == 'CONFIRMED' or value == 'SUCCESS'} ? 'bg-emerald-50 text-emerald-700' :
                      (${value == 'PENDING'} ? 'bg-amber-50 text-amber-700' : 'bg-stone-100 text-stone-600')"
      class="badge"></span>

</body>
</html>
