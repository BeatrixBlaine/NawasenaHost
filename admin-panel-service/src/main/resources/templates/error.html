<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout('Error', '', ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<body>
<main class="mx-auto w-full max-w-3xl px-4 py-8 sm:px-8 sm:py-10">
    <div class="card p-8">
        <p class="text-sm font-semibold text-teal-700" th:text="${error.status}">500</p>
        <h1 class="page-title mt-1">Something went wrong</h1>
        <p class="mt-2 text-sm text-slate-600" th:text="${error.message}"></p>
        <a th:href="@{/dashboard}" class="btn-ghost mt-6">Back to dashboard</a>
    </div>
</main>
</body>
</html>
