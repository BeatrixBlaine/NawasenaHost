<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/components :: head('Log in')}"></head>
<body class="flex min-h-screen items-center justify-center bg-white px-5">

<main class="w-full max-w-sm">
    <a th:href="@{/login-page}" class="wordmark text-2xl">Nawasena<span>Host</span></a>
    <h1 class="mt-8 font-display text-xl font-semibold tracking-tight text-slate-900">Welcome back</h1>
    <p class="mb-8 mt-1 text-sm text-slate-500">Sign in to manage your hotel.</p>

    <p th:if="${param.logout}" class="alert-ok mb-4">You have been logged out.</p>
    <p th:if="${param.expired}" class="mb-4 rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800">Your session expired, please log in again.</p>
    <p th:if="${error}" th:text="${error}" class="alert-error mb-4"></p>

    <form th:action="@{/login}" method="post" class="card space-y-4 p-6">
        <div>
            <label for="username" class="label">Username</label>
            <input id="username" name="username" type="text" required autofocus autocomplete="username" class="input">
        </div>
        <div>
            <label for="password" class="label">Password</label>
            <input id="password" name="password" type="password" required autocomplete="current-password" class="input">
        </div>
        <button type="submit" class="btn w-full">Sign in</button>
    </form>
</main>

</body>
</html>
