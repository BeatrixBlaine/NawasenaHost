<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log in')}"></head>
<body class="flex min-h-screen items-center justify-center px-6">

<main class="w-full max-w-sm">
    <h1 class="mb-1 text-xl font-semibold tracking-tight">NawasenaHost</h1>
    <p class="mb-8 text-sm text-stone-500">Sign in to manage your hotel.</p>

    <p th:if="${param.logout}" class="mb-4 rounded-md border border-stone-200 bg-white px-4 py-3 text-sm text-stone-600">You have been logged out.</p>
    <p th:if="${param.expired}" class="mb-4 rounded-md border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800">Your session expired, please log in again.</p>
    <p th:if="${error}" th:text="${error}" class="mb-4 rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800"></p>

    <form th:action="@{/login}" method="post" class="card space-y-4 p-6">
        <div>
            <label for="username" class="label">Username</label>
            <input id="username" name="username" type="text" required autofocus autocomplete="username" class="input">
        </div>
        <div>
            <label for="password" class="label">Password</label>
            <input id="password" name="password" type="password" required autocomplete="current-password" class="input">
        </div>
        <button type="submit" class="btn w-full">Sign in</button>
    </form>
</main>

</body>
</html>
