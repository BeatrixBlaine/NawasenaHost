spring.application.name=auth-service

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

# optional fixed RSA key for service tokens (see docs/DEPLOYMENT.md)
jwt.rsa.private-key=${JWT_RSA_PRIVATE_KEY:}
jwt.rsa.public-key=${JWT_RSA_PUBLIC_KEY:}

manager.username=${NAWASENAHOST_MANAGER_USERNAME}
manager.password=${NAWASENAHOST_MANAGER_PASSWORD}
manager.email=${NAWASENAHOST_MANAGER_EMAIL}
manager.hotel-id=${NAWASENAHOST_MANAGER_HOTEL_ID:2}

# first system ADMIN, created on startup when username and password are set
admin.username=${NAWASENAHOST_ADMIN_USERNAME:}
admin.password=${NAWASENAHOST_ADMIN_PASSWORD:}
admin.email=${NAWASENAHOST_ADMIN_EMAIL:}

# configure server port
server.port=8087

# connect database
spring.datasource.url=jdbc:mysql://localhost:3311/nawasenahost_auth
spring.datasource.username=root
spring.datasource.password=


eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# info app
info.app.name=auth-service
info.app.description=auth service responsible for authentication and issued JWT
info.app.version=1.0

spring.main.banner-mode=off
springdoc.swagger-ui.path=/my-ui.html
springdoc.api-docs.path=/my-api-docs
logging.level.root=info
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true





