spring.application.name=auth-service

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

manager.username=${NAWASENAHOST_MANAGER_USERNAME}
manager.password=${NAWASENAHOST_MANAGER_PASSWORD}
manager.email=${NAWASENAHOST_MANAGER_EMAIL}
manager.hotel-id=${NAWASENAHOST_HOTEL_ID}

# configure server port
server.port=8087

# connect database
spring.datasource.url=jdbc:mysql://localhost:3311/nawasenahost_auth
spring.datasource.username=root
spring.datasource.password=

# temp user for security
spring.security.user.name=${NAWASENAHOST_ADMIN_USERNAME}
spring.security.user.password=${NAWASENAHOST_ADMIN_PASSWORD}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# info app
info.app.name=auth-service
info.app.description=auth service responsible for authentication and issued JWT
info.app.version=1.0

spring.main.banner-mode=off
springdoc.swagger-ui.path=/my-ui.html
springdoc.api-docs.path=/my-api-docs
logging.level.root=info
management.endpoints.web.exposure.include=*
management.info.env.enabled=true





