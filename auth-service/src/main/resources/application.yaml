spring:
  security:
    oauth2:
      authorizationserver:
        client:
          booking-service:
            registration:
              client-id: booking-service
              client-secret: ${SERVICE_CLIENT_SECRET_BCRYPT}
              client-authentication-methods:
                - client_secret_basic
              authorization-grant-types:
                - client_credentials
              scopes:
                - hotel.read