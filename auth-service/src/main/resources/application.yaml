spring:
  security:
    oauth2:
      authorizationserver:
        client:
          booking-service:
            registration:
              client-id: booking-service
              client-secret: ${SERVICE_CLIENT_SECRET_BCRYPT}
              client-authentication-methods:
                - client_secret_basic
              authorization-grant-types:
                - client_credentials
              scopes:
                - hotel.read
                - room.read
                - payment.create
                - availability.read
                - availability.create
                - customer.read

          payment-service:
            registration:
              client-id: payment-service
              client-secret: ${PAYMENT_CLIENT_SECRET_BCRYPT}
              client-authentication-methods:
                - client_secret_basic
              authorization-grant-types:
                - client_credentials
              scopes:
                - room.read
                - booking.read
                - booking.create

          availability-service:
            registration:
              client-id: availability-service
              client-secret: ${AVAILABILITY_CLIENT_SECRET_BCRYPT}
              client-authentication-methods:
                - client_secret_basic
              authorization-grant-types:
                - client_credentials
              scopes:
                - room.read

          room-service:
            registration:
              client-id: room-service
              client-secret: ${ROOM_CLIENT_SECRET_BCRYPT}
              client-authentication-methods:
                - client_secret_basic
              authorization-grant-types:
                - client_credentials
              scopes:
                - hotel.read